[project]
name = "fraud-detection"
version = "0.1.0"
description = "Fraud detection MLOps pipeline - Claude Code demo"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "mlflow>=2.10",
    "dvc[s3]>=3.0",
    "great-expectations>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
