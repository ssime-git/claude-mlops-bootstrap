name: CI
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
      - run: uv sync
      - run: uvx ruff check src/
      - run: uvx ruff format --check src/
      - run: uvx mypy --strict src/
      - run: uv run pytest tests/ -v --tb=short
